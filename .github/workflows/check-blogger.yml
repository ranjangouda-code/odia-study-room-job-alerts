name: Blogger Job Alerts

on:
  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blogger-job-alerts
  cancel-in-progress: false

jobs:
  check-blogger:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Blogger monitor
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python monitor.py

      - name: Save notification history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add seen_posts.json

          if git diff --cached --quiet; then
            echo "No notification history changes."
            exit 0
          fi

          git commit -m "Update notified job history"

          # Retry if the remote main branch changes before the push.
          for attempt in 1 2 3; do
            echo "Push attempt: $attempt"

            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Notification history successfully saved."
              exit 0
            fi

            echo "Push failed. Retrying..."
            sleep 2
          done

          echo "Unable to push notification history after 3 attempts."
          exit 1
