
name: Blogger Job Alerts

on:
  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blogger-job-alerts
  cancel-in-progress: false

jobs:
  check-blogger:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the complete Git history
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # Step 2: Configure Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Step 3: Install Python dependencies
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Step 4: Check Blogger and send notifications
      - name: Run Blogger monitor
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python monitor.py

      # Step 5: Save notification history safely
      - name: Save notification history
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add seen_posts.json

          if git diff --cached --quiet; then
            echo "No notification history changes."
            exit 0
          fi

          git commit -m "Update notified job history"

          # Retry in case another remote commit arrives during the push.
          for attempt in 1 2 3; do
            echo "Push attempt $attempt"

            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Notification history saved successfully."
              exit 0
            fi

            echo "Push failed. Will retry if attempts remain."
            sleep 2
          done

          echo "Unable to push notification history after 3 attempts."
          exit 1
